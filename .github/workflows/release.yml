name: Release

# Triggered by semver tags (v*). Builds the dashboard bundle, produces
# sdist + wheel via `python -m build`, attaches both to the GitHub Release,
# and — when a trusted-publisher identity is configured via the
# `PYPI_PUBLISH` repo variable — publishes to PyPI.
#
# The PyPI step is gated so this workflow is safe to land without any
# secrets provisioned: releases still get the artifacts attached, they
# just don't auto-publish until the identity is wired up.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # create/update the GitHub Release + upload assets
  # id-token write (for PyPI trusted publishing) is granted on the
  # publish job only, so this job inherits the least-privilege default.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      wheel: ${{ steps.artifacts.outputs.wheel }}
      sdist: ${{ steps.artifacts.outputs.sdist }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Build dashboard bundle
        run: scripts/build-web.sh

      - name: Build sdist + wheel
        run: |
          uv venv .venv --python 3.11
          source .venv/bin/activate
          uv pip install build
          python -m build

      - name: Verify wheel ships web_dist/
        run: |
          wheel_path=$(ls dist/hermes_agent-*.whl | head -1)
          echo "Inspecting $wheel_path"
          entries=$(python -m zipfile -l "$wheel_path" | grep -c "hermes_cli/web_dist/" || true)
          echo "web_dist entries in wheel: $entries"
          if [ "$entries" -lt 2 ]; then
            echo "::error::wheel contains fewer than 2 web_dist entries — bundle likely missing"
            python -m zipfile -l "$wheel_path" | head -40
            exit 1
          fi

      - name: Record artifact paths
        id: artifacts
        run: |
          echo "wheel=$(ls dist/hermes_agent-*.whl | head -1)" >> "$GITHUB_OUTPUT"
          echo "sdist=$(ls dist/hermes_agent-*.tar.gz | head -1)" >> "$GITHUB_OUTPUT"

      - name: Upload dist/ as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          retention-days: 30

      - name: Attach dist to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          # The Release is auto-created by the tag if it doesn't exist.
          generate_release_notes: true
          fail_on_unmatched_files: true

  publish-pypi:
    # Gated: only runs when repo variable PYPI_PUBLISH == "true".
    # Set it to "true" after configuring PyPI trusted publishing for this
    # repo (https://docs.pypi.org/trusted-publishers/).
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/hermes-agent/
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - name: Download dist/ artifact
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
